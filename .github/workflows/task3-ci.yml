# ── Task 3 CI — runs on every push that touches mlops-task3 ──
# A failing test stops the pipeline. That is the whole point.
#
# GitHub only reads workflows from the repository root, so this file lives here
# and every step runs inside mlops-task3/.

name: Task 3 CI

on:
  push:
    branches: [main, develop]
    paths: ["mlops-task3/**", ".github/workflows/task3-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["mlops-task3/**", ".github/workflows/task3-ci.yml"]

defaults:
  run:
    working-directory: mlops-task3

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.7
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt
      - run: pytest tests/ -v --tb=short

  # Build on every run; push to GitHub Container Registry only from main, and only
  # after lint and tests passed (this job `needs: test`, which `needs: lint`).
  # GITHUB_TOKEN is enough — no extra account or secret.
  build:
    name: Docker build & push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs a lower-case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/olist-late-predictor" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
